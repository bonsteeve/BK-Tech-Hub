name: 🚀 Deploy Full Stack (BK Tech Hub)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: 📤 FTP Frontend
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path for your secondary domain's public folder
          server-dir: domains/bktechhub.com/public_html/
          local-dir: frontend/build/
          dangerous-clean-slate: true

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 🔄 Prepare Restart Trigger
        run: |
          mkdir -p backend/tmp
          date > backend/tmp/restart.txt

      - name: 📤 FTP Backend
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/bktechhub.com/
          local-dir: backend/
          # Keep secrets and environment safe on the server
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/.env
            **/secrets/*.json
